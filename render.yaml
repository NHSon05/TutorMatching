# Render Blueprint: Dashboard -> New -> Blueprint -> select this repo.
# Secrets marked `sync: false` are entered once in the Render dashboard.
services:
  - type: web
    name: tutormatching-api
    runtime: docker
    region: singapore
    plan: starter # Free plan sleeps when idle and has no disk or pre-deploy command
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    preDeployCommand: dotnet /app/migrator/TutorMatching.DatabaseMigrator.dll --allow-remote
    autoDeploy: true
    buildFilter:
      paths: ["backend/**", "render.yaml"]
    disk:
      name: uploads
      mountPath: /app/wwwroot/uploads
      sizeGB: 1
    envVars:
      - key: PORT
        value: "8080"
      - key: ConnectionStrings__DefaultConnection
        sync: false # Supabase session pooler connection string
      - key: ConnectionStrings__Redis
        sync: false # Upstash: <endpoint>:6379,password=<pw>,ssl=True,abortConnect=False
      - key: Jwt__SigningKey
        sync: false # openssl rand -base64 32
      - key: Frontend__Origin
        sync: false # https://app.<your-domain>
      - key: Google__ClientId
        sync: false
      - key: Jwt__Issuer
        value: tutormatching-api
      - key: Jwt__Audience
        value: tutormatching-client
      - key: Smtp__Host
        sync: false
      - key: Smtp__Port
        value: "587"
      - key: Smtp__FromAddress
        sync: false
      - key: Smtp__UseTls
        value: "true"
      - key: SeedAdmin__Enabled
        value: "false"

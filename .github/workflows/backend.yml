name: .NET Backend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-ci-${{github.ref}}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore NuGet packages
        run: dotnet restore TutorMatching.slnx

      - name: Build
        run: dotnet build TutorMatching.slnx --no-restore --configuration Release

      - name: Run unit and integration tests
        run: dotnet test TutorMatching.slnx --no-build --configuration Release --verbosity normal
